<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your LogisticsPro account and start managing shipments today.">
    <title>Register — LogisticsPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c63ff;
            --accent: #ff6584;
            --dark: #0d0d1a;
            --border: rgba(255, 255, 255, 0.1);
            --text: #e8e8f0;
            --muted: #8888aa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 60% at 80% 10%, rgba(108, 99, 255, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 20% 90%, rgba(255, 101, 132, 0.2) 0%, transparent 55%);
        }

        .card {
            position: relative;
            z-index: 1;
            width: 520px;
            max-width: 100%;
            background: rgba(15, 15, 30, 0.96);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 52px 48px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            animation: slideUp 0.6s ease both;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #c0c0d8;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            outline: none;
        }

        select option {
            background: #1a1a3e;
            color: var(--text);
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.12);
        }

        input::placeholder {
            color: #555575;
        }

        .role-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
        }

        .role-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: var(--muted);
        }

        .role-option input[type="radio"]:checked+.role-label {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.15);
            color: var(--text);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #9b59b6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.5);
        }

        .divider {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--muted);
        }

        .divider a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .divider a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(255, 101, 132, 0.1);
            border: 1px solid rgba(255, 101, 132, 0.3);
            color: #ff8fa3;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin: 20px 0 10px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(32px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="card">
        <div class="logo">🚚 <span>Logistics</span>Pro</div>
        <h1>Create your account</h1>
        <p class="subtitle">Join thousands of businesses shipping smarter.</p>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" id="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="+91 9876543210">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            </div>

            <div class="section-label">Account Type</div>
            <div class="role-group">
                <div class="role-option">
                    <input type="radio" id="role-customer" name="role" value="customer" checked>
                    <label class="role-label" for="role-customer">👤 Customer</label>
                </div>
                <div class="role-option">
                    <input type="radio" id="role-shipper" name="role" value="shipper">
                    <label class="role-label" for="role-shipper">🚚 Shipper</label>
                </div>
                <div class="role-option">
                    <input type="radio" id="role-admin" name="role" value="admin">
                    <label class="role-label" for="role-admin">🛡️ Admin</label>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="register-btn">Create Account →</button>
        </form>

        <div class="divider">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</body>

</html>
